 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India's Bad-Loan Turnaround</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .presentation-container {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      position: relative;
      background: #111827;
      display: flex;
      flex-direction: column;
    }
    .slide {
      display: none;
      width: 100%;
      height: 100%;
      padding: 20px;
      position: absolute;
      top: 0;
      left: 0;
      overflow-y: auto;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }
    .slide.active {
      display: flex;
      opacity: 1;
    }
    
    /* Welcome Slide Image Transition Effect */
    .welcome-slide {
      position: relative;
      background: linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.85)), 
                  url('https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      animation: bgZoom 10s infinite alternate ease-in-out;
    }
    @keyframes bgZoom {
      0% { background-scale: 1; transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    .welcome-title {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0844);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titlePulse 3s ease-in-out infinite alternate;
      margin-bottom: 15px;
    }
    @keyframes titlePulse {
      0% { filter: drop-shadow(0 0 15px rgba(0,242,254,0.4)); }
      100% { filter: drop-shadow(0 0 30px rgba(255,8,68,0.7)); }
    }
    .welcome-subtitle {
      font-size: clamp(1.1rem, 4vw, 2rem);
      color: #e2e8f0;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* Content Cards */
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin: 10px;
      width: 90%;
      max-width: 800px;
      backdrop-filter: blur(10px);
    }
    
    /* Navigation Controls */
    .controls {
      position: fixed;
      bottom: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    .btn {
      background: #00f2fe;
      color: #0b0f19;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .btn:hover {
      background: #4facfe;
    }
    .slide-number {
      position: fixed;
      top: 15px;
      right: 15px;
      font-size: 0.85rem;
      color: #94a3b8;
      z-index: 100;
      background: rgba(0,0,0,0.4);
      padding: 4px 10px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="presentation-container">
    <div class="slide-number" id="slideNum">Slide 1 / 17</div>

    <!-- Slide 1: Welcome -->
    <div class="slide welcome-slide active">
      <h1 class="welcome-title">WELCOME</h1>
      <p class="welcome-subtitle">To Our Economics Presentation</p>
    </div>

    <!-- Slide 2 -->
    <div class="slide">
      <h2>India's Bad-Loan Turnaround</h2>
      <div class="card">
        <p>A comprehensive analysis of how India resolved its non-performing assets (NPA) crisis and strengthened its banking sector.</p>
      </div>
    </div>

    <!-- Additional slides placeholder logic handled dynamically via JavaScript -->

  </div>

  <div class="controls">
    <button class="btn" onclick="prevSlide()">Previous</button>
    <button class="btn" onclick="nextSlide()">Next</button>
  </div>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = 17; // Adjust total slides as per content

    function updateSlide() {
      slides.forEach((slide, index) => {
        slide.classList.remove('active');
        if (index === currentSlide) {
          slide.classList.add('active');
        }
      });
      document.getElementById('slideNum').innerText = `Slide ${currentSlide + 1} / ${slides.length}`;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }
  </script>
</body>
</html>
